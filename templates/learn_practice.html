{% extends "layout.html" %}
{% block title %}Practice{% endblock %}

{% block content %}
<div class="row g-4 practice-page">
    <!-- Image Preview Section -->
    <div class="col-lg-7">
        <div class="card">
            <div class="card-header text-center">
                <h5 class="mb-0">Practice Using All The Tools Together</h5>
            </div>
            <div class="card-body p-3">
                <div class="canvas-wrapper">
                    <canvas id="edit-canvas"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- Controls Section -->
    <div class="col-lg-5">
        <div class="card mb-3">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Controls</h5>
                <span class="badge bg-primary">Step {{ lesson_id }} of {{ total_lessons }}</span>
            </div>
            <div class="card-body">
                <div class="row">
                    <!-- Two-column layout for sliders to save vertical space -->
                    {% for l in lessons if not l.final_step %}
                    <div class="col-sm-6">
                        <div class="slider-group">
                            <label for="{{ l.tool }}-slider" class="form-label">
                                <span>{{ l.title }}</span>
                                <span class="slider-value">{{ l.default }}</span>
                            </label>
                            <input type="range" class="form-range" id="{{ l.tool }}-slider"
                                min="{{ l.min }}" max="{{ l.max }}" value="{{ l.default }}">
                        </div>
                    </div>
                    {% endfor %}
                </div>
            </div>
        </div>

        <!-- Navigation Buttons -->
        <div class="d-flex justify-content-between">
            <a href="{{ url_for('learn', lesson_id=lesson_id-1) }}" class="btn btn-secondary">Back</a>
            <a href="{{ url_for('quiz', question_id=1) }}" class="btn btn-success">Start Quiz</a>
        </div>
    </div>
</div>
{% endblock %}
