{% extends "layout.html" %}
{% block title %}Quiz{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="quiz-container">

            <p class="quiz-eyebrow mb-2">Question {{ question_id }} of {{ total_questions }}</p>
            <div class="progress quiz-progress" role="progressbar"
                 aria-label="Quiz progress"
                 aria-valuenow="{{ question_id }}" aria-valuemin="0" aria-valuemax="{{ total_questions }}">
                <div class="progress-bar" style="width: {{ (question_id / total_questions * 100)|round|int }}%"></div>
            </div>

            <div class="card mt-4">
                <div class="card-body">
                    <p class="question-text">{{ question.question_text }}</p>
                    <form id="quiz-form" method="POST" data-question-id="{{ question_id }}">
                        <div class="options-container">
                            {% for option in question.options %}
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="answer" value="{{ option.value }}" id="option-{{ option.value }}">
                                    <label class="form-check-label" for="option-{{ option.value }}">
                                        {{ option.text }}
                                    </label>
                                </div>
                            {% endfor %}
                        </div>
                        <div class="feedback-container" id="feedback"></div>
                        <button type="submit" class="btn btn-primary mt-3" id="submit-btn"
                            data-next-id="{{ next_id }}" data-is-last="{{ is_last|lower }}">Check</button>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/quiz.js') }}"></script>
{% endblock %}
